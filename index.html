<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nebula Browser</title>

<!-- defer keeps execution order; register.js relies on it -->
<script src="/prox/scram/scramjet.all.js" defer></script>
<script src="/prox/uv/uv.bundle.js" defer></script>
<script src="/prox/uv/uv.config.js" defer></script>
<script src="/prox/baremux/index.js" defer></script>
<script src="/prox.js" defer></script>
<script src="/register.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --void:#000; --base:#0a0a0a; --surface:#141414; --elevated:#1f1f1f; --overlay:#2a2a2a;
  --border-dim:#333; --border:#4a4a4a; --border-lit:#5a5a5a;
  --aurora-1:#fff; --aurora-2:#f5f5f5; --aurora-3:#e0e0e0;
  --accent:#fff;
  --text-bright:#fff; --text:#d0d0d0; --text-muted:#888; --text-dim:#889; --text-ghost:#555;
  --danger:#ff5c5c; --danger-bg:rgba(255,92,92,.12);
  --r-tab:.5rem .5rem 0 0; --r-sm:.375rem; --r-pill:6.25rem;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.45,0,.55,1);
  --t-fast:90ms; --t-mid:180ms; --t-slow:320ms;
  --font-display:"Syne",system-ui,sans-serif; --font-body:"Outfit",system-ui,sans-serif;
}

@keyframes slide-down { from{opacity:0;transform:translateY(-.4rem)} to{opacity:1;transform:translateY(0)} }
@keyframes tab-in { from{opacity:0;transform:scaleX(.85) translateY(.25rem);transform-origin:left center} to{opacity:1;transform:scaleX(1) translateY(0)} }
@keyframes favicon-spin { to{transform:rotate(360deg)} }
@keyframes aurora-drift {
  0%,100%{transform:translate(0,0) rotate(0)} 33%{transform:translate(.25rem,-.2rem) rotate(1deg)} 66%{transform:translate(-.2rem,.125rem) rotate(-1deg)}
}

*,*::before,*::after { box-sizing:border-box; }
body {
  font-family:var(--font-body); margin:0; background:transparent; color:var(--text);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; font-size:16px;
}

/* shell */
#browser-ui { display:flex; flex-direction:column; flex-shrink:0; animation:slide-down var(--t-slow) var(--ease-out) both; }

/* tabs */
#tabs-strip { display:flex; align-items:flex-end; padding:.625rem .5rem 0; background:var(--void); gap:.2rem; overflow-x:auto; scrollbar-width:none; position:relative; }
#tabs-strip::after { content:""; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--border-dim); }
#tabs-strip::-webkit-scrollbar { display:none; }
.tab {
  display:flex; align-items:center; padding:.5rem .875rem .56rem; background:transparent;
  border-radius:var(--r-tab); border:1px solid transparent; border-bottom:none;
  max-width:13.125rem; min-width:7.5rem; font-family:var(--font-body); font-size:.75rem; font-weight:400;
  cursor:pointer; user-select:none; color:var(--text-muted); position:relative; overflow:hidden;
  transition:color var(--t-mid) var(--ease-out),background var(--t-mid) var(--ease-out),border-color var(--t-mid) var(--ease-out),transform var(--t-fast) var(--ease-out);
  animation:tab-in var(--t-slow) var(--ease-out) both;
}
.tab-favicon { width:1rem; height:1rem; margin-right:.375rem; border-radius:.15rem; flex-shrink:0; object-fit:contain; }
.tab::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.045) 50%,transparent 60%);
  transform:translateX(-100%); transition:transform 0ms;
}
.tab:hover::before { transform:translateX(100%); transition:transform 500ms var(--ease-out); }
.tab:hover { background:var(--surface); color:var(--text); border-color:var(--border-dim); }
.tab:active { transform:translateY(.06rem); }
.tab.active { background:var(--elevated); border-color:var(--border); color:var(--text-bright); z-index:2; font-weight:500; margin-bottom:-1px; padding-bottom:.625rem; }
.tab.active::after { content:""; position:absolute; top:0; left:.75rem; right:.75rem; height:.125rem; background:linear-gradient(90deg,var(--aurora-1),var(--aurora-2)); border-radius:0 0 .2rem .2rem; }
.tab-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; margin-right:.375rem; letter-spacing:.015em; }
.tab-close {
  border:none; background:transparent; color:var(--text-ghost); cursor:pointer; font-size:.7rem;
  width:1.125rem; height:1.125rem; border-radius:.25rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);
}
.tab-close:hover { background:var(--danger-bg); color:var(--danger); transform:scale(1.15); }
.tab-close:active { transform:scale(.9); }
.tab.loading .tab-favicon { animation:favicon-spin 800ms linear infinite; opacity:.6; }

#add-tab-btn {
  background:transparent; border:none; color:var(--text-ghost); width:1.875rem; height:1.875rem; border-radius:50%;
  cursor:pointer; margin-bottom:.2rem; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem;
  transition:background var(--t-mid),color var(--t-mid),transform var(--t-fast);
}
#add-tab-btn:hover { background:var(--surface); color:var(--text); transform:rotate(90deg) scale(1.1); }
#add-tab-btn:active { transform:rotate(90deg) scale(.92); }

/* nav bar */
#nav-bar { background:var(--base); padding:.44rem .625rem .375rem; display:flex; align-items:center; gap:.375rem; border-bottom:1px solid var(--border-dim); position:relative; }
#nav-bar::before { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--border-lit) 30%,var(--border-lit) 70%,transparent); opacity:.5; }
.nav-controls { display:flex; gap:.125rem; }
.nav-controls button, .ibtn {
  background:transparent; border:none; color:var(--text-muted); padding:.375rem; border-radius:var(--r-sm);
  cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:.9rem;
  transition:background var(--t-mid),color var(--t-mid),transform var(--t-fast);
}
.nav-controls button:hover, .ibtn:hover { background:var(--surface); color:var(--text-bright); }
.nav-controls button:active, .ibtn:active { transform:scale(.88); }
.ibtn svg, .ibtn i { pointer-events:none; }
#nav-bookmark.active { color:var(--aurora-1); }
#nav-bookmark.active svg { fill:currentColor; }

/* address bar */
#sj-form {
  flex:1; display:flex; align-items:center; gap:.5rem; background:var(--void); border:1px solid var(--border-dim);
  border-radius:var(--r-pill); padding:0 .875rem; height:2rem; position:relative; overflow:hidden; margin:0 .5rem;
  transition:border-color var(--t-mid),background var(--t-mid);
}
#sj-form::after { content:""; position:absolute; top:0; bottom:0; width:3.75rem; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); transform:translateX(-5rem); pointer-events:none; }
#sj-form:focus-within { border-color:var(--aurora-1); background:var(--base); }
#sj-form:focus-within::after { transform:translateX(37.5rem); transition:transform 500ms var(--ease-out); }
#sj-address { width:100%; background:none; border:none; color:var(--text-bright); font-family:var(--font-body); font-size:.8rem; outline:none; letter-spacing:.01em; }
#sj-address::placeholder { color:var(--text-ghost); }
#sj-address::selection { background:rgba(255,255,255,.25); }

/* bookmark bar */
#bookmark-bar { display:flex; align-items:center; background:var(--base); padding:.2rem .75rem .3rem; gap:.06rem; border-bottom:1px solid var(--border-dim); min-height:1.75rem; overflow-x:auto; scrollbar-width:none; }
#bookmark-bar::-webkit-scrollbar { display:none; }
.bookmark-item {
  display:flex; align-items:center; gap:.3rem; padding:.2rem .625rem; border-radius:var(--r-sm); cursor:pointer;
  font-size:.7rem; color:var(--text-muted); background:transparent; white-space:nowrap; letter-spacing:.01em; user-select:none; max-width:9.375rem;
  transition:background var(--t-mid),color var(--t-mid),transform var(--t-fast);
}
.bookmark-item:hover { background:var(--surface); color:var(--text); transform:translateY(-.06rem); }
.bookmark-item span { overflow:hidden; text-overflow:ellipsis; }
.bookmark-icon { width:.8rem; height:.8rem; flex-shrink:0; opacity:.75; pointer-events:none; transition:opacity var(--t-mid); }
.bookmark-item:hover .bookmark-icon { opacity:1; }

/* webview */
#webview-container { flex:1; position:relative; background:#fff; overflow:hidden; width:100%; }
iframe.sj-frame { border:none; width:100%; height:100%; display:block; animation:slide-down var(--t-slow) var(--ease-out) both; }

/* home */
.home-view { width:100%; height:100%; background:var(--void); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text); position:relative; overflow:hidden; }
.home-view::before, .home-view::after { content:""; position:absolute; border-radius:50%; pointer-events:none; }
.home-view::before { width:31.25rem; height:18.75rem; background:radial-gradient(ellipse,rgba(255,255,255,.08) 0%,transparent 70%); top:-5rem; left:50%; transform:translateX(-50%); animation:aurora-drift 8s var(--ease-in-out) infinite; }
.home-view::after { width:25rem; height:15.625rem; background:radial-gradient(ellipse,rgba(200,200,200,.07) 0%,transparent 70%); bottom:-3.75rem; right:10%; animation:aurora-drift 11s var(--ease-in-out) infinite reverse; }
.home-screen { background:transparent; height:100%; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; position:relative; z-index:1; }
.home-screen h1 { font-size:3rem; margin-bottom:2rem; letter-spacing:-.05em; font-family:'JetBrains Mono',monospace; }
.home-screen h1 span { color:var(--accent); }
.home-screen h3 { color:#fff; font-size:1.2rem; font-family:'Franklin Gothic Medium','Arial Narrow',Arial,sans-serif; }
.bookmarks { display:grid; grid-template-columns:repeat(4,1fr); gap:1.5rem; max-width:37.5rem; }
.bookmark { display:flex; flex-direction:column; align-items:center; gap:.6rem; cursor:pointer; transition:transform .2s; }
.bookmark:hover { transform:translateY(-.3rem); }
.icon-box { width:4rem; height:4rem; background:var(--base); border-radius:1rem; display:flex; align-items:center; justify-content:center; font-size:1.5rem; border:1px solid rgba(255,255,255,.05); color:var(--accent); }
.bookmark span { font-size:.75rem; font-weight:500; color:var(--text-dim); }

/* modal */
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.8); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:9999; }
.modal-content { background:var(--base); border:1px solid var(--accent); padding:1.25rem; border-radius:.75rem; width:90%; max-width:24rem; box-shadow:0 0 1.25rem rgba(255,255,255,.15); max-height:95vh; overflow-y:auto; }
.modal-content h3 { color:var(--accent); margin-top:0; font-size:1.1rem; }
.modal-content select, .modal-content input[type="text"] {
  display:block; width:100%; margin:.3rem 0 .9rem; background:#000; border:1px solid #333; color:var(--text);
  padding:.5rem; border-radius:.3rem; font-family:var(--font-body); font-size:.85rem; height:auto;
}
.modal-content select:focus, .modal-content input[type="text"]:focus { border-color:var(--accent); outline:none; }
.modal-content select option { background:var(--surface); color:var(--text); }
#wisp-url-input { margin:.4rem 0 0 !important; }
.set-label { display:block; font-size:.75rem; color:var(--text-muted); margin-top:.4rem; }
.wisp-opt { display:flex; align-items:center; gap:.5rem; font-size:.8rem; margin:.4rem 0; cursor:pointer; }
.wisp-opt input { width:auto; margin:0; padding:0; }
.modal-actions { display:flex; justify-content:flex-end; gap:.75rem; margin-top:1.25rem; }
#wisp-save-btn { background:var(--accent); color:#000; border:none; padding:.5rem 1.25rem; border-radius:var(--r-sm); font-weight:600; cursor:pointer; font-size:.9rem; transition:opacity .2s; }
#wisp-save-btn:hover { opacity:.9; box-shadow:0 0 .9rem rgba(255,255,255,.3); }
#settings-cancel { background:rgba(255,255,255,.05); color:var(--text); border:1px solid rgba(255,255,255,.1); padding:.5rem .9rem; border-radius:var(--r-sm); cursor:pointer; font-size:.9rem; }
#settings-cancel:hover { background:rgba(255,255,255,.1); }

/* misc */
* { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
::-webkit-scrollbar { width:.3rem; height:.3rem; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-dim); border-radius:.2rem; }
::-webkit-scrollbar-thumb:hover { background:var(--border); }
:focus-visible { outline:.125rem solid var(--aurora-1); outline-offset:.125rem; border-radius:var(--r-sm); }

/* responsive */
@media (max-width:768px) {
  body { font-size:14px; }
  .tab { max-width:10rem; min-width:6rem; font-size:.65rem; }
  .home-screen h1 { font-size:2rem; margin-bottom:1.5rem; }
  .bookmarks { grid-template-columns:repeat(3,1fr); gap:1rem; }
  .icon-box { width:3rem; height:3rem; font-size:1.2rem; }
}
@media (max-width:480px) {
  body { font-size:12px; }
  .tab { max-width:7.5rem; min-width:5rem; font-size:.55rem; padding:.4rem .6rem .5rem; }
  .home-screen h1 { font-size:1.5rem; margin-bottom:1rem; }
  .bookmarks { grid-template-columns:repeat(2,1fr); gap:.8rem; }
  .icon-box { width:2.5rem; height:2.5rem; font-size:1rem; }
  #nav-bar { padding:.3rem .4rem .25rem; }
  .nav-controls button, .ibtn { padding:.25rem; }
  #sj-form { height:1.8rem; margin:0 .25rem; }
}
@media (max-height:600px) {
  body { font-size:11px; }
  #tabs-strip { padding:.25rem .3rem 0; gap:.1rem; }
  .tab { padding:.25rem .5rem .3rem; font-size:.55rem; min-width:5rem; max-width:10rem; }
  .tab-favicon { width:.75rem; height:.75rem; margin-right:.25rem; }
  #nav-bar { padding:.25rem .4rem .2rem; gap:.2rem; }
  .nav-controls button, .ibtn { padding:.2rem; }
  #sj-form { gap:.25rem; }
  .home-screen { padding:1rem; }
  .home-screen h1 { font-size:1.5rem; margin-bottom:.75rem; }
  .home-screen h3 { font-size:.8rem; margin-bottom:.5rem; }
  .bookmarks { grid-template-columns:repeat(2,1fr); gap:.5rem; max-width:100%; width:100%; }
  .icon-box { width:2rem; height:2rem; font-size:.9rem; border-radius:.5rem; }
  .bookmark span { font-size:.6rem; }
  #bookmark-bar { padding:.18rem .35rem .22rem; min-height:1.4rem; gap:.14rem; flex-wrap:wrap; align-items:flex-start; overflow-x:hidden; overflow-y:auto; max-height:3.2rem; }
  .bookmark-item { padding:.16rem .35rem; font-size:.62rem; gap:.22rem; max-width:40vw; }
  .bookmark-icon { width:.66rem; height:.66rem; }
}
@media (max-height:450px) {
  body { font-size:10px; }
  #tabs-strip { padding:.2rem .2rem 0; }
  .tab { padding:.2rem .4rem .25rem; font-size:.5rem; min-width:4.5rem; }
  .tab-favicon { width:.7rem; height:.7rem; margin-right:.2rem; }
  #nav-bar { padding:.2rem .3rem .15rem; gap:.15rem; }
  .nav-controls button, .ibtn { padding:.15rem; }
  .home-screen h1 { font-size:1.2rem; margin-bottom:.5rem; }
  .home-screen h3 { font-size:.65rem; }
  #bookmark-bar { padding:.14rem .28rem .18rem; min-height:1.2rem; max-height:2.6rem; }
  .bookmark-item { padding:.12rem .28rem; font-size:.56rem; max-width:44vw; }
  .bookmark-icon { width:.58rem; height:.58rem; }
  .icon-box { width:1.5rem; height:1.5rem; font-size:.8rem; }
  .bookmark span { font-size:.5rem; }
}
</style>
</head>

<body>
<div id="browser-ui">
  <div id="tabs-strip">
    <button id="add-tab-btn" title="New Tab"><i data-lucide="plus"></i></button>
  </div>

  <div id="nav-bar">
    <div class="nav-controls">
      <button id="nav-back"><i data-lucide="chevron-left"></i></button>
      <button id="nav-forward"><i data-lucide="chevron-right"></i></button>
      <button id="nav-reload"><i data-lucide="rotate-cw"></i></button>
    </div>

    <form id="sj-form">
      <input id="sj-address" type="text" placeholder="Search or type a URL" autocomplete="off" />
      <button type="submit" tabindex="-1" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;"></button>
      <button type="button" id="nav-bookmark" class="ibtn" title="Bookmark"><i data-lucide="star"></i></button>
      <button type="button" id="fullscreen-toggle" class="ibtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen"><i data-lucide="maximize-2"></i></button>
      <button type="button" id="nav-inspect" class="ibtn" title="Developer Tools"><i data-lucide="code"></i></button>
      <button type="button" id="settings-btn" class="ibtn" title="Settings"><i data-lucide="settings"></i></button>
    </form>
  </div>

  <div id="bookmark-bar"></div>
</div>

<div id="webview-container">
  <div id="home-template" class="home-view" style="display:none;">
    <div class="home-screen">
      <br>
      <h1>Nebula<span> Browser</span></h1>
      <h3>No restrictions, no censorship. Just browse freely with peace of mind.</h3>
      <div class="bookmarks">
        <div class="bookmark" onclick="navigateToUrl('google.com')"><div class="icon-box"><i class="fa-brands fa-google"></i></div><span>Google</span></div>
        <div class="bookmark" onclick="navigateToUrl('youtube.com')"><div class="icon-box"><i class="fa-brands fa-youtube"></i></div><span>YouTube</span></div>
        <div class="bookmark" onclick="navigateToUrl('tiktok.com')"><div class="icon-box"><i class="fa-brands fa-tiktok"></i></div><span>Tiktok</span></div>
        <div class="bookmark" onclick="navigateToUrl('github.com')"><div class="icon-box"><i class="fa-brands fa-github"></i></div><span>GitHub</span></div>
        <div class="bookmark" onclick="navigateToUrl('xbox.com/en-US/cloud-gaming')"><div class="icon-box"><i class="fa-brands fa-xbox"></i></div><span>Xbox Cloud Gaming</span></div>
        <div class="bookmark" onclick="navigateToUrl('chatgpt.com')"><div class="icon-box"><i class="fa-solid fa-microchip"></i></div><span>ChatGPT</span></div>
        <div class="bookmark" onclick="navigateToUrl('twitch.tv')"><div class="icon-box"><i class="fa-brands fa-twitch"></i></div><span>Twitch</span></div>
        <div class="bookmark" onclick="navigateToUrl('discord.com')"><div class="icon-box"><i class="fa-brands fa-discord"></i></div><span>Discord</span></div>
      </div>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Settings</h3>

    <label class="set-label" for="search-engine-selector">Search Engine</label>
    <select id="search-engine-selector">
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="google">Google</option>
      <option value="bing">Bing</option>
      <option value="yahoo">Yahoo</option>
    </select>

    <label class="set-label" for="engine-selector">Proxy Engine</label>
    <select id="engine-selector">
      <option value="scramjet">Scramjet</option>
      <option value="uv">UV</option>
    </select>

    <label class="set-label">Wisp Server</label>
    <label class="wisp-opt"><input type="radio" name="wisp-choice" value="wss://wisp.mercurywork.shop/" checked> wss://wisp.mercurywork.shop/ (default)</label>
    <label class="wisp-opt"><input type="radio" name="wisp-choice" value="wss://bee.science-edu.me/"> wss://bee.science-edu.me/</label>
    <label class="wisp-opt"><input type="radio" name="wisp-choice" value="custom"> Custom</label>
    <input id="wisp-url-input" type="text" placeholder="wss://..." autocomplete="off" style="display:none;" />

    <div class="modal-actions">
      <button type="button" id="settings-cancel">Cancel</button>
      <button type="button" id="wisp-save-btn">Save</button>
    </div>
  </div>
</div>

<script>
lucide.createIcons({ attrs: { width: 16, height: 16, 'stroke-width': 2 } });

if (!sessionStorage.getItem('scramWarned')) {
  sessionStorage.setItem('scramWarned', '1');
  alert('Some sites might not work on Scramjet engine. Change to UV if a site doesnt work and see if it works.');
}
</script>
</body>
</html>
